            font-family: Arial, sans-serif;
            background-color: #eef2f7;

            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .contact-card {
            background: #fff;

        }

            color: #007bff;

        }
        a {
            text-decoration: none;
            color: #333;
            font-size: 18px;
            background: #007bff;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            transition: 0.3s;
        }
        a:hover {
            background: #0056b3;
        }
    </style>
</head>

    <div class="contact-card">
